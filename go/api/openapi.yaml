openapi: 3.0.3
info:
  description: Product integration API for Haulout product integrations. The product
    integration key is supplied as p_product_key in each RPC body. The apikey header
    uses Haulout's public service key; it is not the product key.
  title: Haulout Provider RPC API
  version: 2.0.0
servers:
- url: https://qszqptdtmkppelqligvb.supabase.co/rest/v1
security:
- HauloutServiceKey: []
paths:
  /rpc/put_metrics_by_key:
    post:
      description: Upserts 1–100 current metric values for the product. Writes are
        last-write-wins with no compare-and-swap or idempotency receipt. A put replaces
        the whole metric; omitted label and format become null. An identical rewrite
        is a no-op and returns the existing revision. A product may hold at most 256
        metrics. Batches are limited to 1 MiB. No argument has a SQL default.
      operationId: putMetricsByKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/putMetricsByKey_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/MetricWriteResult"
                type: array
          description: "One row per input metric, in input order."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostgrestError"
          description: "API error. Code 22023 means an invalid metric, value shape,\
            \ batch, duplicate key, or product metric limit. Code 28000 means an invalid\
            \ product key."
      summary: Upsert current metric values
  /rpc/delete_metrics_by_key:
    post:
      description: "Deletes the listed metric keys from the product. Unknown keys\
        \ are ignored, so retries are safe. Returns the keys actually deleted. Accepts\
        \ 1–256 keys. No argument has a SQL default."
      operationId: deleteMetricsByKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/deleteMetricsByKey_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/DeletedMetric"
                type: array
          description: "Keys deleted by this call, one row per deleted metric."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostgrestError"
          description: API error. Code 22023 means invalid or out-of-range keys. Code
            28000 means an invalid product key.
      summary: Delete current metric values
components:
  schemas:
    ProductKey:
      description: The product's current integration key. Supplied only in p_product_key;
        rotation invalidates the previous key immediately.
      type: string
    MetricKey:
      description: "Metric identifier, unique within a product."
      pattern: "^[a-z][a-z0-9_.-]{0,63}$"
      type: string
    Metric:
      description: "One current metric value. The value shape depends on kind and\
        \ is validated by the API: number: a JSON number; text: a string up to 4096\
        \ characters; status: {state: neutral|positive|warning|critical, text}; progress:\
        \ {current >= 0, total > 0}; gauge: {value, min, max}; list: {items: [{id,\
        \ label, detail?, done?, progress?, state?}]}, up to 500 items; timeseries:\
        \ {series: [{label, color?, points: [{t, v}]}]}, 1–8 series of up to 2000\
        \ points each; t is an RFC 3339 timestamp and v is a number or null (a gap);\
        \ bar: {bars: [{label, value, color?}]}, 1–100 bars; table: {columns: [label],\
        \ rows: [[scalar]]}, 1–16 columns and up to 500 rows."
      properties:
        key:
          description: "Metric identifier, unique within a product."
          pattern: "^[a-z][a-z0-9_.-]{0,63}$"
          type: string
        kind:
          enum:
          - number
          - text
          - status
          - progress
          - gauge
          - list
          - timeseries
          - bar
          - table
          type: string
        label:
          maxLength: 100
          minLength: 1
          type: string
        format:
          $ref: "#/components/schemas/MetricFormat"
        value:
          description: Kind-specific value; see the Metric description.
      required:
      - key
      - kind
      - value
      type: object
    MetricFormat:
      description: Display hint for a metric value.
      properties:
        style:
          enum:
          - number
          - percent
          - bytes
          - duration
          - rate
          - temperature
          - date
          - time
          - dateTime
          type: string
        precision:
          maximum: 6
          minimum: 0
          type: integer
        unit:
          maxLength: 32
          type: string
      required:
      - style
      type: object
    MetricWriteResult:
      example:
        key: key
        revision: 1
        updated_at: 2000-01-23T04:56:07.000+00:00
      properties:
        key:
          description: "Metric identifier, unique within a product."
          pattern: "^[a-z][a-z0-9_.-]{0,63}$"
          type: string
        revision:
          format: int64
          minimum: 1
          type: integer
        updated_at:
          format: date-time
          type: string
      required:
      - key
      - revision
      - updated_at
      type: object
    DeletedMetric:
      example:
        key: key
      properties:
        key:
          description: "Metric identifier, unique within a product."
          pattern: "^[a-z][a-z0-9_.-]{0,63}$"
          type: string
      required:
      - key
      type: object
    PostgrestError:
      description: API JSON error body; the error code is in code and text in message.
      example:
        code: code
        message: message
        details: details
        hint: hint
      properties:
        code:
          type: string
        message:
          type: string
        details:
          nullable: true
          type: string
        hint:
          nullable: true
          type: string
      required:
      - code
      - message
      type: object
    putMetricsByKey_request:
      properties:
        p_product_key:
          description: The product's current integration key. Supplied only in p_product_key;
            rotation invalidates the previous key immediately.
          type: string
        p_metrics:
          items:
            $ref: "#/components/schemas/Metric"
          maxItems: 100
          minItems: 1
          type: array
      required:
      - p_metrics
      - p_product_key
      type: object
    deleteMetricsByKey_request:
      properties:
        p_product_key:
          description: The product's current integration key. Supplied only in p_product_key;
            rotation invalidates the previous key immediately.
          type: string
        p_keys:
          items:
            $ref: "#/components/schemas/MetricKey"
          maxItems: 256
          minItems: 1
          type: array
      required:
      - p_keys
      - p_product_key
      type: object
  securitySchemes:
    HauloutServiceKey:
      description: "Haulout service publishable key, not the product integration key."
      in: header
      name: apikey
      type: apiKey
      x-haulout-service-key: sb_publishable_hV_aFsYqfTC90-M6pfXzjg_woQxAscg
