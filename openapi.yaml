openapi: 3.0.3
info:
  title: Haulout Provider RPC API
  version: 2.1.0
  description: >-
    Product integration API for Haulout product integrations. The product
    integration key is supplied as p_product_key in each RPC body. The apikey
    header uses Haulout's public service key; it is not the product key.
    Notification RPCs also authenticate with p_product_key.
servers:
  - url: https://qszqptdtmkppelqligvb.supabase.co/rest/v1
security:
  - HauloutServiceKey: []
paths:
  /rpc/put_metrics_by_key:
    post:
      operationId: putMetricsByKey
      summary: Upsert current metric values
      description: >-
        Upserts 1–100 current metric values for the product. Writes are
        last-write-wins with no compare-and-swap or idempotency receipt. A put
        replaces the whole metric; omitted label and format become null. An
        identical rewrite is a no-op and returns the existing revision. A
        product may hold at most 256 metrics. Batches are limited to 1 MiB. No
        argument has a SQL default.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_product_key, p_metrics]
              properties:
                p_product_key:
                  $ref: '#/components/schemas/ProductKey'
                p_metrics:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    $ref: '#/components/schemas/Metric'
      responses:
        '200':
          description: One row per input metric, in input order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MetricWriteResult'
        default:
          description: >-
            API error. Code 22023 means an invalid metric, value shape, batch,
            duplicate key, or product metric limit. Code 28000 means an invalid
            product key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgrestError'
  /rpc/delete_metrics_by_key:
    post:
      operationId: deleteMetricsByKey
      summary: Delete current metric values
      description: >-
        Deletes the listed metric keys from the product. Unknown keys are
        ignored, so retries are safe. Returns the keys actually deleted. Accepts
        1–256 keys. No argument has a SQL default.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_product_key, p_keys]
              properties:
                p_product_key:
                  $ref: '#/components/schemas/ProductKey'
                p_keys:
                  type: array
                  minItems: 1
                  maxItems: 256
                  items:
                    $ref: '#/components/schemas/MetricKey'
      responses:
        '200':
          description: Keys deleted by this call, one row per deleted metric.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeletedMetric'
        default:
          description: >-
            API error. Code 22023 means invalid or out-of-range keys. Code 28000
            means an invalid product key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgrestError'
  /rpc/put_notification_categories_by_key:
    post:
      operationId: putNotificationCategoriesByKey
      summary: Replace notification categories
      description: >-
        Replaces the product's whole notification category set with the
        supplied categories (0–64). Categories omitted from the batch are
        deleted, and their device subscriptions are removed with them. Keys
        already present update their label and description in place. An empty
        array clears every category.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_product_key, p_categories]
              properties:
                p_product_key:
                  $ref: '#/components/schemas/ProductKey'
                p_categories:
                  type: array
                  maxItems: 64
                  items:
                    $ref: '#/components/schemas/NotificationCategory'
      responses:
        '200':
          description: One row per supplied category, in input order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationCategoryResult'
        default:
          description: >-
            API error. Code 22023 means an invalid, duplicate, or over-limit
            category batch. Code 28000 means an invalid product key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgrestError'
  /rpc/send_notification_by_key:
    post:
      operationId: sendNotificationByKey
      summary: Send a notification to subscribed devices
      description: >-
        Pushes a title and optional body to every device subscribed to the
        category. Nothing is stored; the payload exists only for dispatch. The
        recipients count is the number of subscribed devices whose sessions are
        currently live, so 0 means nobody is subscribed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_product_key, p_category, p_title, p_body]
              properties:
                p_product_key:
                  $ref: '#/components/schemas/ProductKey'
                p_category:
                  $ref: '#/components/schemas/NotificationCategoryKey'
                p_title:
                  type: string
                  minLength: 1
                  maxLength: 100
                p_body:
                  type: string
                  maxLength: 500
                  description: May be an empty string.
      responses:
        '200':
          description: Exactly one row with the count of targeted devices.
          content:
            application/json:
              schema:
                type: array
                minItems: 1
                maxItems: 1
                items:
                  $ref: '#/components/schemas/NotificationSendResult'
        default:
          description: >-
            API error. Code 22023 means an invalid or unknown category, title, or
            body. Code 28000 means an invalid product key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgrestError'
components:
  securitySchemes:
    HauloutServiceKey:
      type: apiKey
      in: header
      name: apikey
      description: Haulout service publishable key, not the product integration key.
      x-haulout-service-key: sb_publishable_hV_aFsYqfTC90-M6pfXzjg_woQxAscg
  schemas:
    ProductKey:
      type: string
      description: >-
        The product's current integration key. Supplied only in p_product_key;
        rotation invalidates the previous key immediately.
    MetricKey:
      type: string
      pattern: '^[a-z][a-z0-9_.-]{0,63}$'
      description: Metric identifier, unique within a product.
    Metric:
      type: object
      description: >-
        One current metric value. The value shape depends on kind and is
        validated by the API:
        number: a JSON number;
        text: a string up to 4096 characters;
        status: {state: neutral|positive|warning|critical, text};
        progress: {current >= 0, total > 0};
        gauge: {value, min, max};
        list: {items: [{id, label, detail?, done?, progress?, state?}]}, up to 500 items;
        timeseries: {series: [{label, color?, points: [{t, v}]}]}, 1–8 series of up to 2000 points each; t is an RFC 3339 timestamp and v is a number or null (a gap);
        bar: {bars: [{label, value, color?}]}, 1–100 bars;
        table: {columns: [label], align?: [left|center|right], rows: [[scalar]]}, 1–16 columns and up to 500 rows; align, when present, has one entry per column (default left).
      required: [key, kind, value]
      properties:
        key:
          $ref: '#/components/schemas/MetricKey'
        kind:
          type: string
          enum: [number, text, status, progress, gauge, list, timeseries, bar, table]
        label:
          type: string
          minLength: 1
          maxLength: 100
        format:
          $ref: '#/components/schemas/MetricFormat'
        value:
          description: Kind-specific value; see the Metric description.
    MetricFormat:
      type: object
      description: Display hint for a metric value.
      required: [style]
      properties:
        style:
          type: string
          enum: [number, percent, bytes, duration, rate, temperature, date, time, dateTime]
        precision:
          type: integer
          minimum: 0
          maximum: 6
        unit:
          type: string
          maxLength: 32
    MetricWriteResult:
      type: object
      required: [key, revision, updated_at]
      properties:
        key:
          $ref: '#/components/schemas/MetricKey'
        revision:
          type: integer
          format: int64
          minimum: 1
        updated_at:
          type: string
          format: date-time
    DeletedMetric:
      type: object
      required: [key]
      properties:
        key:
          $ref: '#/components/schemas/MetricKey'
    NotificationCategoryKey:
      type: string
      pattern: '^[a-z][a-z0-9_.-]{0,63}$'
      description: Notification category identifier, unique within a product.
    NotificationCategory:
      type: object
      required: [key, label]
      properties:
        key:
          $ref: '#/components/schemas/NotificationCategoryKey'
        label:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          minLength: 1
          maxLength: 280
    NotificationCategoryResult:
      type: object
      required: [key]
      properties:
        key:
          $ref: '#/components/schemas/NotificationCategoryKey'
    NotificationSendResult:
      type: object
      required: [recipients]
      properties:
        recipients:
          type: integer
          minimum: 0
    PostgrestError:
      type: object
      description: API JSON error body; the error code is in code and text in message.
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: string
          nullable: true
        hint:
          type: string
          nullable: true
