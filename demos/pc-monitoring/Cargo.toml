[package]
name = "haulout-pc-monitoring"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
dotenvy = "0.15.7"
haulout = { version = "0.1.0", path = "../../rust" }
nvml-wrapper = "0.13.0"
plist = "1.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
starship-battery = "0.12.0"
sysinfo = "0.39.6"
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread", "time", "signal"] }
